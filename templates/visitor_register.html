
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiYatra - Visitor Registration</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        .container {
            max-width: 480px;
            margin: 30px auto;
            padding: 30px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #123b68;
        }

        p {
            text-align: center;
            color: #64748b;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        .consent {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-top: 20px;
            font-size: 14px;
            line-height: 1.5;
        }

        .consent input {
            width: auto;
            margin-top: 3px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #123b68;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d548c;
        }

        .back {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #123b68;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>DigiYatra</h1>

        <p>Visitor Registration</p>

        <p>
            Enter your basic details to begin the
            simulated airport verification process.
        </p>

        {% if success %}
            <p style="color: green; font-weight: bold;">
                {{ success }}
            </p>
        {% endif %}

        {% if error %}
            <p style="color: red; font-weight: bold;">
                {{ error }}
            </p>
        {% endif %}

        <form method="POST"
              action="{{ url_for('visitor_register') }}">

            <label for="full_name">Full Name *</label>
            <input
                type="text"
                id="full_name"
                name="full_name"
                placeholder="Enter your full name"
                required
            >

            <label for="age">Age (Optional)</label>
            <input
                type="number"
                id="age"
                name="age"
                min="1"
                max="120"
                placeholder="Enter your age"
            >

            <label for="destination">Destination *</label>
            <input
                type="text"
                id="destination"
                name="destination"
                placeholder="Enter your destination"
                required
            >

            <label class="consent">
                <input
                    type="checkbox"
                    name="face_consent"
                    value="yes"
                    required
                >

                <span>
                    I voluntarily agree to temporary face-image
                    capture and processing for this educational
                    DigiYatra demonstration. I understand that
                    this is a simulated prototype.
                </span>
            </label>

            <button type="submit">
                Continue to Face Registration
            </button>

        </form>

        <a class="back" href="{{ url_for('project_home') }}">
            Back to Homepage
        </a>

    </div>

</body>
</html>
